version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/tamilapp

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      runas: root
  AfterInstall:
    - location: scripts/set_permissions.sh # This script no longer needs to move the db file
    - location: scripts/migrate_db.sh
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      runas: root